name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish win-x64
        run: dotnet publish -c Release -r win-x64 --self-contained -o publish/win-x64

      - name: Publish win-arm64
        run: dotnet publish -c Release -r win-arm64 --self-contained -o publish/win-arm64

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/win-x64/* -DestinationPath "dist/KeepReadingDriver-$($env:GITHUB_REF_NAME)-win-x64.zip"
          Compress-Archive -Path publish/win-arm64/* -DestinationPath "dist/KeepReadingDriver-$($env:GITHUB_REF_NAME)-win-arm64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/*.zip --title "$env:GITHUB_REF_NAME" --generate-notes
